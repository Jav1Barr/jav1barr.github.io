<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletin 2 formularios </title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/login.php" method="post">
        <label for="usuario">Nombre o Email</label>
        <input type="text" id="usuario" name="usuario" placeholder="usuario@dominio.com" required><br><br>
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" required><br><br>
        <label for="recordar">Recordar sesión</label>
        <input type="checkbox" name="recordar" id="recordar"><br><br>
        <button type="submit">Iniciar sesión</button>

    </form>
</body>
</html>
