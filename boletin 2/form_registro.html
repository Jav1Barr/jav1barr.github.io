<!DOCTYPE html>
<html lang=es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Registro </title>
</head>

<body>
    <form action="action=" https://lm.ciclo.iesnervion.es/registro.php"" method="post">
        <label for="codigo">Código de alumno</label>
        <input type="text" name="codigo" id="codigo" pattern="[A-Z]{3}[0-9]{3}" required><br>
        <label name="email">Correo corporativo</label>
        <input name="email" id="email" type="email" required><br>
        <label name="edad">Edad</label>
        <input name="edad" id="edad" type="number" min="16" max="65"><br>
        <label name="telefono">Telefono de contacto</label>
        <input name="telefono" id="telefono" type="tel" pattern="[0-9]{9}"><br>
        <label name="ide">IDE preferido</label>
        <input type="text" name="ide" id="ide" list="ides"><br>
        <datalist name="ide" id="ides">
            <option value="Visual studio code">
            <option value="Eclipse">
            <option value="Intellij IDEA">
        </datalist>
        <label name="politica">Aceptacion de la politica de privacidad</label>
        <input type="checkbox" name="politica" id="politica" required><br>
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
